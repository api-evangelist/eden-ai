    Every feature tool takes `model` as "provider" or "provider/model"; call list_models for the
    exact names, pricing and regions.
  file_parameters: File parameters take a public URL or a file ID returned by upload_file.
  long_running: >-
    Async feature tools return a job id immediately; poll check_job until status is success or fail.
