tools:
- name: list_models
  description: List available providers/models and their pricing.
- name: list_voices
  description: 'List the voices a text-to-speech model accepts, for audio_tts''s ''voice''.


    The model''s default voice comes first.'
- name: upload_file
  description: 'Upload a file to Eden AI and get a file ID to use in other tools.


    Only needed for local file content. If you already have a public URL

    for the file, pass that URL directly to the tool''s file parameter

    instead — no upload needed.'
- name: check_job
  description: Get the status/result of an async job started by a long-running tool.
- name: manage_collections
  description: 'Create and manage collections: stored sets of items (e.g. faces) that a tool searches
    against. Tools that take a collection_id: image_face_recognition. Flow: create, then add_item once
    per file (returns the item ids it indexed), then call the tool with the collection_id; delete when
    done. Arguments per action: create(model, tool?, name?); list(tool?, model?, page?); get, delete,
    list_items(collection_id); add_item(collection_id, file); delete_item(collection_id, item_id).'
- name: audio_speech_to_text
  description: 'Speech Recognition (or speech to text or voice to text) can recognize and transcribe spoken
    words (voice),  that will be converted to text with or without diarization. It is also possible to
    filter profanity. The type of files allowed are: mp3, wav, m4a. If convert_to_wav option is set to
    true, then you can transcribe any type of audio or video files. Long-running: returns a job immediately;
    poll it with check_job(job_id) every few seconds until status is ''success'' or ''fail''. File parameters
    accept a file ID from upload_file or a direct file URL — if you already have a URL, pass it as-is
    (no upload needed).'
- name: audio_tts
  description: Text-to-speech (TTS) is a technology that converts written text into spoken audio, enabling
    computers and digital devices to "read" text aloud.  It is also known as speech synthesis, read aloud
    technology, or computer-generated speech.
- name: image_ai_detection
  description: Determine whether an image was generated by AI or is a real photograph or artwork. File
    parameters accept a file ID from upload_file or a direct file URL — if you already have a URL, pass
    it as-is (no upload needed).
- name: image_anonymization
  description: Image Anonymization API, also known as image de-identification or image de-personalization,
