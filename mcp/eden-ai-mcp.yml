description: >-
  Eden AI publishes a hosted, remote Model Context Protocol server that exposes its expert-model
  catalog (OCR, web, image, text, translation, audio, video) as MCP tools, plus three utility
  tools. Every tool call is a normal Eden AI expert-model call billed to the key in the
  Authorization header. tools/list answers ANONYMOUSLY over streamable HTTP, so the full tool
  catalogue with per-tool inputSchema was captured live rather than inferred from prose.
deployment:
  mode: remote
  endpoint: https://mcp.edenai.run/mcp
  auth: api-key
  verified: probed
transport: streamable-http
authentication:
  header: Authorization
  scheme: Bearer
  credential: Eden AI API key (sk-eden-...)
  note: >-
    tools/list is served without credentials; tools/call bills the key in the Authorization
    header. No /.well-known/oauth-authorization-server or /.well-known/oauth-protected-resource
    is served on mcp.edenai.run (both 404 on 2026-09-06).
