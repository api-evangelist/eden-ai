description: 'Eden AI is a French AI gateway that puts one API, one key and one invoice in front of 500+ AI models
  from 50+ providers. Its v3 surface is deliberately OpenAI-wire-compatible — chat completions, responses, embeddings,
  moderations, images and audio — with an Anthropic Messages pass-through alongside it, so existing SDK code moves
  over by swapping a base URL. A single model-routed Universal AI endpoint covers the expert models that are not
  LLMs: OCR and document parsing, image and video analysis, speech, translation, text analysis and web research,
  synchronously or as async jobs with signed webhooks. Routing, provider fallback, response caching, per-key budgets,
  guardrails and per-request cost reporting are built into the gateway, and an EU endpoint restricts processing
  to providers cleared for European data residency.'
