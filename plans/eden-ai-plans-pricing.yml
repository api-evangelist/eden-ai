specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Eden AI
providerId: eden-ai
created: '2026-05-04'
modified: '2026-09-06'
generated: '2026-09-06'
method: searched
source: https://www.edenai.co/docs/v3/overview/plans-prices
docs:
  - https://www.edenai.co/docs/v3/overview/plans-prices
  - https://www.edenai.co/pricing
  - https://www.edenai.co/docs/v3/general/buying-credits
tags:
  - Artificial Intelligence
  - AI Gateway
  - Pricing
description: >-
  Eden AI's two published plans, read from the provider's own plans-and-pricing documentation on
  2026-09-06. This file REPLACES a 2026-05-04 scaffold whose tiers, quotas and prices were invented
  defaults; Eden AI has never published a request-quota plan of that shape.
pricing_model:
  type: usage-based-credits
  markup: none
  platform_fee_percent: 5.5
  currency: USD
  statement: >-
    "Eden AI charges no markup on provider pricing. You pay exactly what the underlying provider
    charges, plus a 5.5% platform fee applied at checkout."
  per_request_cost_field: >-
    Every API response carries a `cost` field in USD for that request.
  billing_modes:
    - {mode: prepaid, default: true, description: 'Buy credits; usage draws them down. Auto-refill available (threshold + refill amount).'}
    - {mode: postpaid, default: false, description: 'Usage accrues monthly and is invoiced, default terms 30 days. Optional monthly spend limit. Arranged as part of an Advanced/Enterprise plan.'}
  payment_methods: [card (Visa/Mastercard/Amex, Apple Pay, Google Pay), PayPal, bank transfer]
  depleted_balance_behavior: 'API requests fail with 402 Payment Required'
plans:
  - id: self-serve-ai-api
    name: Self-serve AI API
    type: pay-as-you-go
    price: null
    price_note: 'Pay as you go — provider price plus a 5.5% platform fee. No subscription price.'
    currency: USD
    billing_period: usage
    self_serve: true
    included:
      - No markup on provider pricing
      - Access to hundreds of AI models and providers
      - Unified API and billing
      - Cost and performance monitoring
      - Multiple API keys
      - Auto-refill credits
      - Unlimited seats
      - Chat support (48 working hours)
    limits:
      - {name: rate limit, value: 10, unit: requests/second, adjustable: true,
         note: 'Raised on request. The same page''s Self-serve bullet list states 7 req/sec upgradable to 15 — see rate-limits/eden-ai-rate-limits.yml for the recorded conflict.'}
    excluded: [bulk discounts, private deployments, custom latency and cost optimization, dedicated support and SLA, professional services, custom billing]
  - id: advanced-ai-platform
    name: Advanced AI Platform
    type: enterprise
    price: null
    price_note: 'Custom — contact sales via live chat. No public price.'
    currency: USD
    billing_period: custom
    self_serve: false
    included:
      - Everything in Self-serve
      - Higher rate limits tailored to the workload
      - Bulk / volume-based discounts
      - Private deployments (dedicated infrastructure)
      - Custom latency and cost optimization
      - Dedicated support channel with SLA
      - Professional services (Eden AI engineers)
      - Custom billing and payment terms
    limits:
      - {name: rate limit, value: null, unit: requests/second, note: 'Custom (higher); no figure published.'}
per_model_pricing:
  published: true
  mechanism: >-
    Per-provider, per-model, per-subfeature prices are served machine-readably and anonymously from
    the API itself.
  endpoints:
    - {url: 'https://api.edenai.run/v2/info/provider_subfeatures', status: 200, note: 'Full price list per provider subfeature (~2.5 MB JSON, no key required).'}
    - {url: 'https://api.edenai.run/v3/models', note: 'LLM catalog with extended metadata; requires a key.'}
    - {tool: list_models, surface: 'https://mcp.edenai.run/mcp', note: 'The MCP server exposes the same catalog and pricing as a tool.'}
plan_count: 2
