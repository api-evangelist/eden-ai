graph_notes:
  - >-
    There is no Customer/Account entity in the contract. The account is implicit in the bearer key,
    which is why the key hierarchy carries so much of the model.
  - >-
    The model catalog is read-only and shared; nothing a caller creates references it by foreign key
    except through the free-text `model` string. An agent cannot validate a model name structurally
    — it has to call list_models (or the MCP list_models tool) first.
  - >-
    `previous_response_id` on StoredResponse is the only self-referencing relationship, and it is
    how multi-turn conversations avoid resending history.
