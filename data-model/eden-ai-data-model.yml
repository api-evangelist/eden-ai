description: >-
  The entity graph an agent has to hold in its head to drive Eden AI. It is small and mostly flat —
  a gateway's data model is thin by design, because the interesting nouns (models, providers) live
  in a catalog rather than in the caller's account. The one real hierarchy is on the credential
  side, where three key tiers mint each other.
id_conventions:
