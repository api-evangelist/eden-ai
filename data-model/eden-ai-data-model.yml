  - {entity: async job, format: uuid, field: 'job_id (v3) / public_id (v2 list item)'}
  - {entity: file, format: uuid, field: file_id}
  - {entity: collection, format: uuid, field: collection_id}
  - {entity: stored response, format: string, field: 'response_id / id'}
  - {entity: model, format: 'provider/model-id', field: id}
