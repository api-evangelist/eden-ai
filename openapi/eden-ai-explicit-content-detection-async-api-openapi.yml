openapi: 3.2.0
info:
  title: Video Features Explicit Content Detection Async API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Explicit Content Detection Async
paths:
  /video/explicit_content_detection_async/:
    get:
      operationId: video_explicit_content_detection_async_retrieve
      description: 'Get a list of all jobs launched for this feature. You''ll then be able to use the ID of each one to get its status and results.


        Please note that a **job status doesn''t get updated until a get request** is sent.'
      summary: Video Explicit Content Detection List Jobs
      tags:
      - Explicit Content Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    jobs:
                    - providers: '[''google'', ''amazon'']'
                      nb: 2
                      nb_ok: 2
                      public_id: abadc7eb-da00-4d8d-b1ca-ab16e690a4a5
                      state: finished
                      created_at: '2026-09-06T00:05:21.736897'
                    - providers: '[''google'', ''amazon'']'
                      nb: 2
                      nb_ok: 2
                      public_id: a66b1dec-05ab-4d0a-8bd7-12690c32fc1e
                      state: finished
                      created_at: '2026-09-05T23:05:21.736911'
                    - providers: '[''google'', ''amazon'']'
                      nb: 2
                      nb_ok: 2
                      public_id: 3c8ea178-ff3c-4864-9fa5-7cdfa21cbc1a
                      state: finished
                      created_at: '2026-09-05T22:05:21.736917'
                  summary: Response Example
          description: ''
    post:
      operationId: video_explicit_content_detection_async_create
      description: 'Available Providers


        |Provider|Version|Price|Billing unit|

        |----|-------|-----|------------|

        |**amazon**|`boto3`|0.1 (per 60 seconde)|60 seconde

        |**google**|`Video intelligence v1`|0.1 (per 60 seconde)|1 seconde'
      summary: Video Explicit Content Detection Launch Job
      tags:
      - Explicit Content Detection Async
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: google,amazon
                  file: /edenai/edenai/features/video/samples/data/faces.mp4
                summary: Request Example
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: google,amazon
                  file_url: http://edenai-resource-example.mp4
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    public_id: 6ee2b8e2-e441-47a0-bb69-ecc71aa266f2
                  summary: Response Example
          description: ''
    delete:
      operationId: video_explicit_content_detection_async_destroy
      description: 'Generic class to handle method GET all async job for user


        Attributes:

        feature (str): EdenAI feature

        subfeature (str): EdenAI subfeature'
      summary: Video Explicit Content delete Jobs
      tags:
      - Explicit Content Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /video/explicit_content_detection_async/{public_id}/:
    get:
