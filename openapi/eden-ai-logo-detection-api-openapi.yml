openapi: 3.2.0
info:
  title: Image Features Logo Detection API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Logo Detection
paths:
  /image/logo_detection/:
    post:
      operationId: image_logo_detection_create
      description: 'Available Providers


        |Provider|Model|Version|Price|Billing unit|

        |----|----|-------|-----|------------|

        |**google**|-|`v1`|1.5 (per 1000 file)|1 file

        |**microsoft**|-|`v3.2`|1.0 (per 1000 file)|1 file

        |**api4ai**|-|`v1.0.0`|0.25 (per 1000 file)|1 file

        |**api4ai**|**v1**|`v1.0.0`|0.25 (per 1000 file)|1 file

        |**api4ai**|**v2**|`v1.0.0`|0.25 (per 1000 file)|1 file

        |**openai**|-|`v1`|24.0 (per 1000 file)|1 file

        |**openai**|**gpt-4o**|`v1`|24.0 (per 1000 file)|1 file

        |**openai**|**gpt-4-turbo**|`v1`|48.0 (per 1000 file)|1 file


        Supported Models


        Default Models


        |Name|Value|

        |----|-----|

        |**api4ai**|`v2`|

        |**openai**|`gpt-4o`|'
      summary: Logo Detection
      tags:
      - Logo Detection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/imagelogo_detectionLogoDetectionRequest'
            examples:
              RequestExample:
                value:
                  providers: google,microsoft,api4ai,openai
                  file_url: http://edenai-resource-example.jpg
                summary: Request Example
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/imagelogo_detectionLogoDetectionRequest'
            examples:
              RequestExample:
                value:
                  providers: google,microsoft,api4ai,openai
                  file: /edenai/edenai/features/image/samples/data/logo_detection.jpeg
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imagelogo_detectionResponseModel'
              examples:
                ResponseExample:
                  value:
                    google:
                      items: []
                      cost: 0.0
                    microsoft:
                      items:
                      - bounding_poly:
                          vertices:
                          - x: 301.0
                            y: 124.0
                          - x: 543.0
                            y: 124.0
                          - x: 543.0
                            y: 400.0
                          - x: 301.0
                            y: 400.0
                        description: Apple
                        score: 0.891
                      cost: 0.0
                    api4ai:
                      items:
                      - bounding_poly:
                          vertices:
                          - x: 0.0
                            y: 0.11240538954734802
                          - x: 0.997164249420166
                            y: 0.11240538954734802
                          - x: 0.997164249420166
                            y: 0.6311928331851959
                          - x: 0.0
                            y: 0.6311928331851959
                        description: Yahoo
                        score: 0.8487341403961182
                      - bounding_poly:
                          vertices:
                          - x: 0.0
                            y: 0.10130736231803894
                          - x: 1.0
                            y: 0.10130736231803894
                          - x: 1.0
                            y: 0.6678279936313629
                          - x: 0.0
                            y: 0.6678279936313629
                        description: Unicef
                        score: 0.1362941861152649
                      cost: 0.0
                    openai:
                      items:
                      - bounding_poly:
                          vertices:
                          - x: 0.0
                            y: 0.0
                          - x: 40.0
                            y: 0.0
                          - x: 40.0
                            y: 40.0
                          - x: 0.0
                            y: 40.0
                        description: Facebook
                        score: 0.99
                      - bounding_poly:
                          vertices:
                          - x: 60.0
                            y: 0.0
                          - x: 100.0
                            y: 0.0
                          - x: 100.0
                            y: 40.0
                          - x: 60.0
                            y: 40.0
                        description: Apple
                        score: 0.99
                      - bounding_poly:
                          vertices:
                          - x: 120.0
                            y: 0.0
                          - x: 160.0
                            y: 0.0
