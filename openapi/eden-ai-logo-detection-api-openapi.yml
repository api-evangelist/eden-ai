                            y: 40.0
                        description: Amazon
                        score: 0.99
                      - bounding_poly:
                          vertices:
                          - x: 180.0
                            y: 0.0
                          - x: 220.0
                            y: 0.0
                          - x: 220.0
                            y: 40.0
                          - x: 180.0
                            y: 40.0
                        description: Netflix
                        score: 0.99
                      - bounding_poly:
                          vertices:
                          - x: 240.0
                            y: 0.0
                          - x: 280.0
