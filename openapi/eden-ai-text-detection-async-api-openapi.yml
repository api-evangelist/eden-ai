openapi: 3.2.0
info:
  title: Video Features Text Detection Async API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Text Detection Async
paths:
  /video/text_detection_async/:
    get:
      operationId: video_text_detection_async_retrieve
      description: 'Get a list of all jobs launched for this feature. You''ll then be able to use the ID of each one to get its status and results.


        Please note that a **job status doesn''t get updated until a get request** is sent.'
      summary: Text Detection List Jobs
      tags:
      - Text Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    jobs:
                    - providers: '[''amazon'', ''twelvelabs'', ''google'']'
                      nb: 3
                      nb_ok: 3
                      public_id: 102a8455-35a5-4236-922f-923bde530001
                      state: finished
                      created_at: '2026-09-06T00:05:18.729761'
                    - providers: '[''amazon'', ''twelvelabs'', ''google'']'
                      nb: 3
                      nb_ok: 3
                      public_id: 29133271-ed0c-48b0-8160-ecbe5687aea2
                      state: finished
                      created_at: '2026-09-05T23:05:18.729774'
                    - providers: '[''amazon'', ''twelvelabs'', ''google'']'
                      nb: 3
                      nb_ok: 3
                      public_id: ea5ca4bb-b9b3-4eb6-98fa-d7b34f3697e2
                      state: finished
                      created_at: '2026-09-05T22:05:18.729781'
                  summary: Response Example
          description: ''
    post:
      operationId: video_text_detection_async_create
      description: 'Available Providers


        |Provider|Version|Price|Billing unit|

        |----|-------|-----|------------|

        |**amazon**|`boto3`|0.1 (per 60 seconde)|60 seconde

        |**google**|`Video intelligence v1`|0.15 (per 60 seconde)|1 seconde

        |**twelvelabs**|`v1.1.2`|0.067 (per 60 seconde)|60 seconde'
      summary: Text Detection Launch Job
      tags:
      - Text Detection Async
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,twelvelabs,google
                  file: /edenai/edenai/features/video/samples/data/text_video.mp4
                summary: Request Example
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,twelvelabs,google
                  file_url: http://edenai-resource-example.mp4
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    public_id: 8678b639-75ef-41ac-833a-1286fe44ac38
                  summary: Response Example
          description: ''
    delete:
      operationId: video_text_detection_async_destroy
      description: 'Generic class to handle method GET all async job for user


        Attributes:

        feature (str): EdenAI feature

        subfeature (str): EdenAI subfeature'
      summary: Text Detection delete Jobs
      tags:
      - Text Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /video/text_detection_async/{public_id}/:
    get:
      operationId: video_text_detection_async_retrieve_2
      description: Get the status and results of an async job given its ID.
      summary: Text Detection Get Job Results
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      - in: query
        name: response_as_dict
        schema:
          type: boolean
          default: true
      - in: query
        name: show_base_64
        schema:
          type: boolean
          default: true
      - in: query
        name: show_original_response
        schema:
          type: boolean
          default: false
      tags:
      - Text Detection Async
      security:
      - FeatureApiAuth: []
      responses:
