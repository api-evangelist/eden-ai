                        subcategory: Medical
                      - label: Violence
                        likelihood: 3
                        likelihood_score: 0.6
                        category: Violence
                        subcategory: Violence
                      - label: Racy
                        likelihood: 1
                        likelihood_score: 0.2
                        category: HateAndExtremism
                        subcategory: Racy
                      cost: 0.0
                    microsoft:
                      nsfw_likelihood: 3
                      nsfw_likelihood_score: 0.5288681387901306
                      items:
                      - label: Gore
                        likelihood: 3
                        likelihood_score: 0.5288681387901306
