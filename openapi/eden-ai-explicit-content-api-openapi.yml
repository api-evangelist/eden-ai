                        subcategory: GraphicViolenceOrGore
                      - label: Adult
                        likelihood: 1
                        likelihood_score: 0.00892699882388115
                        category: Sexual
                        subcategory: Sexual
                      - label: Racy
                        likelihood: 1
                        likelihood_score: 0.011913839727640152
                        category: HateAndExtremism
                        subcategory: Racy
                      cost: 0.0
                    sentisight:
                      nsfw_likelihood: 0
                      nsfw_likelihood_score: 0.0
