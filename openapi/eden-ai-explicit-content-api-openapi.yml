openapi: 3.2.0
info:
  title: Image Features Explicit Content API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Explicit Content
paths:
  /image/explicit_content/:
    post:
      operationId: image_explicit_content_create
      description: 'Available Providers


        |Provider|Model|Version|Price|Billing unit|

        |----|----|-------|-----|------------|

        |**amazon**|-|`boto3 (v1.15.18)`|1.0 (per 1000 file)|1 file

        |**google**|-|`v1`|1.5 (per 1000 file)|1 file

        |**microsoft**|-|`v3.2`|1.0 (per 1000 file)|1 file

        |**sentisight**|-|`v3.3.1`|0.75 (per 1000 file)|1 file

        |**openai**|**gpt-4o**|`v1`|24.0 (per 1000 file)|1 file

        |**openai**|-|`v1`|24.0 (per 1000 file)|1 file


        Supported Models


        Default Models


        |Name|Value|

        |----|-----|

        |**openai**|`gpt-4o`|'
      summary: Explicit Content Detection
      tags:
      - Explicit Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/imageanonymizationimagelandmark_detectionimageexplicit_contentimagedeepfake_detectionImageRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,google,microsoft,sentisight,openai
                  file_url: http://edenai-resource-example.jpg
                summary: Request Example
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/imageanonymizationimagelandmark_detectionimageexplicit_contentimagedeepfake_detectionImageRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,google,microsoft,sentisight,openai
                  file: /edenai/edenai/features/image/samples/data/explicit_content.jpeg
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageexplicit_contentResponseModel'
              examples:
                ResponseExample:
                  value:
                    amazon:
                      nsfw_likelihood: 5
                      nsfw_likelihood_score: 0.9282218933105468
                      items:
                      - label: Graphic Violence Or Gore
                        likelihood: 5
                        likelihood_score: 0.9282218933105468
                        category: Violence
                        subcategory: GraphicViolenceOrGore
                      - label: Violence
                        likelihood: 5
                        likelihood_score: 0.9282218933105468
                        category: Violence
                        subcategory: Violence
                      cost: 0.0
                    google:
                      nsfw_likelihood: 3
                      nsfw_likelihood_score: 0.6
