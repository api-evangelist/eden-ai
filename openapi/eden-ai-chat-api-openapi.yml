    multimodalchatChatRequest:
      type: object
      properties:
        settings:
          type: string
          default: {}
          description: "A dictionnary or a json object to specify specific models to use for some providers. <br>                     It can be in the following format: {\"google\" : \"google_model\", \"ibm\": \"ibm_model\"...}.\n                     "
        providers:
          type: array
          items:
            type: string
            minLength: 1
          description: 'It can be one (ex: **''amazon''** or **''google''**) or multiple provider(s) (ex: **''amazon,microsoft,google''**)             that the data will be redirected to in order to get the processed results.<br>             Providers can also be invoked with specific models (ex: providers: **''amazon/model1, amazon/model2, google/model3''**)'
        fallback_providers:
          type: array
          items:
            type: string
          default: []
          description: "Providers in this list will be used as fallback if the call to provider in `providers` parameter fails.\n    To use this feature, you must input **only one** provider in the `providers` parameter. but you can put up to 5 fallbacks.\n\nThey will be tried in the same order they are input, and it will stop to the first provider who doesn't fail.\n\n\n*Doesn't work with async subfeatures.*\n    "
          maxItems: 5
        response_as_dict:
          type: boolean
          default: true
          description: "Optional : When set to **true** (default), the response is an object of responses with providers names as keys : <br> \n                  ``` {\"google\" : { \"status\": \"success\", ... }, } ``` <br>\n                When set to **false** the response structure is a list of response objects : <br> \n                   ``` [{\"status\": \"success\", \"provider\": \"google\" ... }, ] ```. <br>\n                  "
        attributes_as_list:
          type: boolean
          default: false
          description: "Optional : When set to **false** (default) the structure of the extracted items is list of objects having different attributes : <br>\n     ```{'items': [{\"attribute_1\": \"x1\",\"attribute_2\": \"y2\"}, ... ]}``` <br>\n     When it is set to **true**, the response contains an object with each attribute as a list : <br>\n     ```{ \"attribute_1\": [\"x1\",\"x2\", ...], \"attribute_2\": [y1, y2, ...]}``` "
        show_base_64:
          type: boolean
          default: true
        show_original_response:
          type: boolean
          default: false
          description: "Optional : Shows the original response of the provider.<br>\n        When set to **true**, a new attribute *original_response* will appear in the response object."
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: "A list containing all the conversations between the user and the assistant. Each item in the list should be a dictionary with two keys: 'role' and 'message'.\n\n**role**: Specifies the role of the speaker and can have the values 'user' or 'assistant'.\n\n**message**: A list of dictionaries. Each dictionary in the 'message' list must contain the keys 'type' and 'content'.\n\n#### Structure\n- **type**: Specifies the type of content and can be 'media_url', 'media_base64', or 'text'.\n- **content**: A dictionary with the actual content based on the 'type':\n  - If 'type' is 'media_url', 'content' must contain 'media_url' and must not contain 'media_base64' or 'text'.\n  - If 'type' is 'media_base64', 'content' must contain 'media_base64' and must not contain 'media_url' or 'text'.\n  - If 'type' is 'text', 'content' must contain 'text' and must not contain 'media_url' or 'media_base64'.\n\n#### Example\n```json\n[\n  {\n    'role': 'user',\n    'content': [\n      {\n        'type': 'text',\n        'content': {'text': 'Describe this image'}\n      },\n      {\n        'type': 'media_url',\n        'content': {\n           'media_url': 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Gfp-wisconsin-madison-the-nature-boardwalk.jpg/2560px-Gfp-wisconsin-madison-the-nature-boardwalk.jpg',\n           'media_type': 'image/jpeg'}\n      },\n    ]\n  }\n]\n```"
        chatbot_global_action:
          type:
          - string
          - 'null'
          description: A system message that helps set the behavior of the assistant. For example, 'You are a helpful assistant'.
        temperature:
          type: number
          format: double
          maximum: 2
          minimum: 0
          default: 0.0
          description: Controls the creativity of the model's responses. Higher values (up to 2) make the output more random, while lower values make it more focused and deterministic. A value of 0 (argmax sampling) is useful for scenarios requiring precise answers.
        max_tokens:
          type: integer
          maximum: 300000
          minimum: 1
          default: 2048
          description: The maximum number of tokens to generate in the completion. This value, combined with the token count of your prompt, cannot exceed the model's context length.
        stop_sequences:
          type: array
          items:
            type: string
          default: []
          description: A list of sequences where the model will stop generating further tokens. Useful for controlling response length and format.
        top_k:
          type: integer
          maximum: 500
          minimum: 0
          description: Limits the sampling pool to the top K options for each token. Setting this to a lower value can make the output more focused and deterministic.
        top_p:
          type: number
          format: double
          maximum: 1
          minimum: 0
          description: Enables nucleus sampling, where the model considers the smallest number of tokens whose cumulative probability is at least top_p. This allows for a dynamic selection of tokens based on probability, offering a balance between focus and creativity.
        reasoning_effort:
          allOf:
          - $ref: '#/components/schemas/ReasoningEffortEnum'
          description: "Optional parameter to control the model's reasoning depth. \nAllows specifying the level of analytical effort in generating responses. \n\n**Choices**:\n- 'low': Minimal reasoning, quick responses\n- 'medium': Balanced reasoning approach\n- 'high': In-depth, comprehensive reasoning\n\n**Example**: 'high' for complex problem-solving tasks\n\n* `low` - low\n* `medium` - medium\n* `high` - high"
      required:
      - messages
      - providers
