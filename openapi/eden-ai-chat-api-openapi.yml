    ServiceTierEnum:
      enum:
      - auto
      - default
      type: string
      description: '**Choices**:

        - ''auto'': Automatically select appropriate tier

        - ''default'': Use default service configuration


        * `auto` - auto

        * `default` - default'
    llmchatllmchatChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: "A list containing all the conversations between the user and the assistant.\nEach item in the list should be a dictionary with two keys: 'role' and 'message'.\n\n**role**: Specifies the role of the speaker and can have the values 'user', 'system', 'assistant' or 'tool'.\nThe system role instructs the way the model should answer, e.g. 'You are a helpful assistant'. The user\nrole specifies the user query and assistant is the model's response. The tool role is for external tools that\ncan be used in the conversation.\n\n**message**: A list of dictionaries. Each dictionary in the 'message' list must contain the keys 'type' and 'content'.\n\n#### Structure\n- **type**: Specifies the type of content and can be 'image_url' or 'text'.\n- **content**: A dictionary with the actual content based on the 'type':\n    - If 'type' is 'image_url', 'content' must contain 'image_url' and must not contain 'text'.\n    - If 'type' is 'text', 'content' must contain 'text' and must not contain 'image_url'.\n\n#### Example\n```json\n[\n  {\n    \"role\": \"user\",\n    \"content\": [\n        {\n          \"type\": \"text\",\n          \"text\": \"Describe this image\"\n        },\n        {\n        \"type\": \"image_url\",\n        \"image_url\": {\n          \"url\": \"https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Gfp-wisconsin-madison-the-nature-boardwalk.jpg/2560px-Gfp-wisconsin-madison-the-nature-boardwalk.jpg\"\n          }\n        }\n    ]\n  }\n]\n```"
        model:
          type: string
          minLength: 1
          description: "The OpenAI model to use for the chat completion. \nThis field is required and specifies which language model will process the conversation. \n\n**Example values**: 'gpt-3.5-turbo', 'gpt-4', 'gpt-4-turbo'"
        reasoning_effort:
          allOf:
          - $ref: '#/components/schemas/ReasoningEffortEnum'
          description: "Optional parameter to control the model's reasoning depth. \nAllows specifying the level of analytical effort in generating responses. \n\n**Choices**:\n- 'low': Minimal reasoning, quick responses\n- 'medium': Balanced reasoning approach\n- 'high': In-depth, comprehensive reasoning\n\n**Example**: 'high' for complex problem-solving tasks\n\n* `low` - low\n* `medium` - medium\n* `high` - high"
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/MetadataRequest'
          description: "Optional list of metadata associated with the chat request. \nCan be used to provide additional context or tracking information. \n\n**Example**:\n```json\n{\n  \"metadata\": [\n    {\"key\": \"conversation_id\", \"value\": \"chat_12345\"},\n    {\"key\": \"source\", \"value\": \"customer_support\"}\n  ]\n}\n```"
        frequency_penalty:
          type: number
          format: double
          maximum: 2.0
          minimum: -2.0
          description: "Controls repetitiveness of model responses by penalizing frequent tokens. \nRanges from -2.0 to 2.0. \n\n**Values**:\n- Positive values: Reduce token repetition\n- Negative values: Encourage repetition\n- 0.0: Default behavior\n\n**Example**: 1.5 to significantly reduce repeated phrases"
        logit_bias:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "Modify the likelihood of specific tokens appearing in the response. \nA dictionary where keys are token IDs and values are bias scores. \n\n**Example**:\n```json\n{\n  \"logit_bias\": {\n    \"50256\": -100,  # Reduce probability of end-of-text token\n    \"15\": 5  # Slightly increase probability of a specific token\n  }\n}\n```"
        logprobs:
          type: boolean
          description: "If set to True, returns log probabilities of the most likely tokens. \nUseful for advanced token probability analysis. \n\n**Example**: True to get detailed token likelihood information"
        top_logprobs:
          type: integer
          maximum: 20
          minimum: 0
          description: "Number of top log probabilities to return with each token. \nMust be between 0 and 20. \n\n**Example**: 5 to get top 5 most likely tokens for each position"
        max_completion_tokens:
          type: integer
          minimum: 1
          description: "Maximum number of tokens to generate in the completion. \nMust be at least 1. \n\n**Example**: 150 to limit response to approximately 100-150 words"
        n:
          type: integer
          minimum: 1
          description: "Number of chat completion choices to generate.\n\n    **Example**: 3 to generate multiple alternative responses"
        modalities:
          type: array
          items:
            type: string
            minLength: 1
          description: "List of supported input/output modalities for the chat. \n\n**Example**:\n```json\n{\n  \"modalities\": [\"text\", \"image\", \"audio\"]\n}\n```"
        prediction:
          type: object
          additionalProperties: {}
          description: "Optional field for storing prediction-related information. \nFlexible dictionary to capture model's predictive metadata. \n\n**Example**:\n```json\n{\n  \"prediction\": {\n    \"confidence_score\": 0.85,\n    \"top_prediction\": \"response_category\"\n  }\n}\n```"
        audio:
          type: object
          additionalProperties: {}
          description: "Optional dictionary for audio-related parameters or metadata. \n\n**Example**:\n```json\n{\n  \"audio\": {\n    \"language\": \"en-US\",\n    \"transcription_format\": \"srt\"\n  }\n}\n```"
        presence_penalty:
          type: number
          format: double
          maximum: 2.0
          minimum: -2.0
          description: "Adjusts likelihood of discussing new topics by penalizing existing tokens. \nRanges from -2.0 to 2.0. \n\n**Values**:\n- Positive values: Encourage more diverse topics\n- Negative values: Keep discussion more focused\n- 0.0: Default behavior\n\n**Example**: 1.0 to promote topic diversity"
        response_format:
          type: object
          additionalProperties: {}
          description: "Specify the desired response format for the completion. \n\n**Example**:\n```json\n{\n  \"response_format\": {\n    \"type\": \"json_object\",\n    \"schema\": {...}\n  }\n}\n```"
        seed:
          type: integer
          description: "Set a seed for deterministic sampling to reproduce consistent results. \n\n**Example**: 42 for a reproducible random generation process"
        service_tier:
          allOf:
          - $ref: '#/components/schemas/ServiceTierEnum'
          description: "Select the service tier for the API request. \n\n**Choices**:\n- 'auto': Automatically select appropriate tier\n- 'default': Use default service configuration\n\n* `auto` - auto\n* `default` - default"
        stop:
          type: array
          items:
            type: string
            minLength: 1
          description: "List of strings that will cause the model to stop generating. \n\n**Example**:\n```json\n{\n  \"stop\": [\"\\n\", \"Human:\", \"AI:\"]\n}\n```"
        stream:
          type: boolean
          default: false
          description: "If True, returns tokens as they are generated in a streaming format. \nDefault is False. \n\n**Example**: True for real-time token streaming"
        stream_options:
          type: object
          additionalProperties: {}
          description: "Additional configuration for streaming responses. \n\n**Example**:\n```json\n{\n  \"stream_options\": {\n    \"include_usage\": true\n  }\n}\n```"
        temperature:
          type: number
          format: double
          maximum: 2
          minimum: 0
          description: "Controls randomness in token selection. \nRanges from 0.0 to 2.0. \n\n**Values**:\n- 0.0: Most deterministic, focused responses\n- 1.0: Balanced randomness\n- 2.0: Most creative, unpredictable responses\n\n**Example**: 0.7 for a good balance of creativity and focus"
        top_p:
          type: number
          format: double
          maximum: 1
          minimum: 0
          description: "Nucleus sampling threshold for token selection. \nRanges from 0.0 to 1.0. Default is 1.0. \n\n**Values**:\n- 1.0: Consider all tokens\n- Lower values: More focused, deterministic sampling\n\n**Example**: 0.9 to select from top 90% most probable tokens"
        tools:
          type: array
          items: {}
          description: "List of tools or function definitions available to the model. \n\n**Example**:\n```json\n{\n  \"tools\": [\n    {\n      \"type\": \"function\",\n      \"function\": {\n        \"name\": \"get_weather\",\n        \"description\": \"Retrieve current weather\"\n      }\n    }\n  ]\n}\n```"
        tool_choice:
          type: string
          minLength: 1
          description: "Specify how tools should be used in the completion. \n\n**Example values**:\n- 'auto': Model decides when to use tools\n- 'none': Disable tool usage\n- Specific tool name to always use a particular tool"
        parallel_tool_calls:
          type: boolean
          description: "Allow the model to make multiple tool calls in parallel. \n\n**Example**: True to enable concurrent tool invocations"
        user:
          type: string
          minLength: 1
          description: "Optional identifier for the end-user to help track and monitor API usage. \n\n**Example**: 'user_123456'"
        function_call:
          type: string
          minLength: 1
          description: "Control how function calls are handled. \n\n**Example values**:\n- 'auto': Default behavior\n- 'none': Disable function calls\n- Specific function name to force its execution"
        functions:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: "List of function definitions available to the model. \n\n**Example**:\n```json\n{\n  \"functions\": [\n    {\n      \"name\": \"get_current_weather\",\n      \"description\": \"Get the current weather for a location\",\n      \"parameters\": {...}\n    }\n  ]\n}\n```"
        thinking:
          allOf:
          - $ref: '#/components/schemas/ThinkingRequest'
          description: "Configuration for enabling Claude's extended thinking. When enabled, responses include thinking content blocks showing Claude's thinking process before the final answer. Requires a minimum budget of 1,024 tokens and counts towards your max_tokens limit.\n\n**Example**:\n```json\n{\n  'thinking': {\n    'type': 'enabled'\n    'budget_tokens': '1024'  }\n}\n```"
        web_search_options:
          type: object
          additionalProperties: {}
          description: "Options for web search integration. \n        **Example**:\n        ```json\n        web_search_options={\n            \"search_context_size\": \"medium\"  # Options: \"low\", \"medium\", \"high\"\n        }\n        ```"
      required:
      - messages
      - model
