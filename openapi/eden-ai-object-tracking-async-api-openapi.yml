openapi: 3.2.0
info:
  title: Video Features Object Tracking Async API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Object Tracking Async
paths:
  /video/object_tracking_async/:
    get:
      operationId: video_object_tracking_async_retrieve
      description: 'Get a list of all jobs launched for this feature. You''ll then be able to use the ID of each one to get its status and results.


        Please note that a **job status doesn''t get updated until a get request** is sent.'
      summary: Video Object Tracking List Jobs
      tags:
      - Object Tracking Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    jobs:
                    - providers: '[''google'']'
                      nb: 1
                      nb_ok: 1
                      public_id: 5d612417-d462-4581-a217-51a404dd9634
                      state: finished
                      created_at: '2026-09-06T00:05:21.030987'
                    - providers: '[''google'']'
                      nb: 1
                      nb_ok: 1
                      public_id: e47719fb-f081-41e5-b676-fa76658cd4a2
                      state: finished
                      created_at: '2026-09-05T23:05:21.031000'
                    - providers: '[''google'']'
                      nb: 1
                      nb_ok: 1
                      public_id: 94c7b447-80b9-4ec5-a6c2-d908d64322ef
                      state: finished
                      created_at: '2026-09-05T22:05:21.031006'
                  summary: Response Example
          description: ''
    post:
      operationId: video_object_tracking_async_create
      description: 'Available Providers


        |Provider|Version|Price|Billing unit|

        |----|-------|-----|------------|

        |**google**|`Video intelligence v1`|0.15 (per 60 seconde)|1 seconde'
      summary: Video Object Tracking Launch Job
      tags:
      - Object Tracking Async
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: google
                  file: /edenai/edenai/features/video/samples/data/faces.mp4
                summary: Request Example
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: google
                  file_url: http://edenai-resource-example.mp4
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    public_id: d9f7a091-3b71-4c95-a080-97ff22d6e80b
                  summary: Response Example
          description: ''
    delete:
      operationId: video_object_tracking_async_destroy
      description: 'Generic class to handle method GET all async job for user


        Attributes:

        feature (str): EdenAI feature

        subfeature (str): EdenAI subfeature'
      summary: Video Object Tracking delete Jobs
      tags:
      - Object Tracking Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /video/object_tracking_async/{public_id}/:
    get:
      operationId: video_object_tracking_async_retrieve_2
      description: Get the status and results of an async job given its ID.
      summary: Video Object Tracking Get Job Results
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      - in: query
        name: response_as_dict
        schema:
          type: boolean
          default: true
      - in: query
        name: show_base_64
        schema:
          type: boolean
          default: true
      - in: query
        name: show_original_response
        schema:
          type: boolean
          default: false
      tags:
      - Object Tracking Async
      security:
      - FeatureApiAuth: []
      responses:
