          - $ref: '#/components/schemas/FinalStatusEnum'
          title: Final Status
        error:
          additionalProperties: true
          default: null
          title: Error
          type: object
      required:
      - num_pages
      - id
      - final_status
      title: ocrocr_tables_asyncOcrTablesAsyncDataClass
      type: object
    StateEnum:
      enum:
      - finished
      - failed
      - Timeout error
      - processing
      type: string
      description: '* `finished` - finished

        * `failed` - failed

        * `Timeout error` - Timeout error

        * `processing` - processing'
    FieldError:
      type: object
      properties:
        <parameter_name>:
          type: array
          items:
            type: string
      required:
      - <parameter_name>
    asyncocrocr_tables_asyncResponseModel:
      properties:
        results:
          $ref: '#/components/schemas/ocrocr_tables_asyncModel'
        error:
          title: Error
          type: string
        public_id:
          format: uuid
          title: Public Id
          type: string
        status:
          title: Status
          type: string
      required:
      - results
      - error
      - public_id
      - status
      title: asyncocrocr_tables_asyncResponseModel
      type: object
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/NestedError'
      required:
      - error
    AsyncJobList:
      type: object
      properties:
        providers:
          type: string
        nb:
          type: integer
        nb_ok:
          type: integer
        public_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/StateEnum'
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - nb
      - nb_ok
      - providers
      - public_id
      - state
    NestedBadRequest:
      type: object
      properties:
        type:
          type: string
        message:
          $ref: '#/components/schemas/FieldError'
      required:
      - message
      - type
    BadRequest:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/NestedBadRequest'
      required:
      - error
    OcrTablesAsyncRequest:
      type: object
      properties:
        settings:
          type: string
          default: {}
          description: "A dictionnary or a json object to specify specific models to use for some providers. <br>                     It can be in the following format: {\"google\" : \"google_model\", \"ibm\": \"ibm_model\"...}.\n                     "
        providers:
          type: array
          items:
            type: string
            minLength: 1
          description: 'It can be one (ex: **''amazon''** or **''google''**) or multiple provider(s) (ex: **''amazon,microsoft,google''**)             that the data will be redirected to in order to get the processed results.<br>             Providers can also be invoked with specific models (ex: providers: **''amazon/model1, amazon/model2, google/model3''**)'
        fallback_providers:
          type: array
          items:
            type: string
          default: []
          description: "Providers in this list will be used as fallback if the call to provider in `providers` parameter fails.\n    To use this feature, you must input **only one** provider in the `providers` parameter. but you can put up to 5 fallbacks.\n\nThey will be tried in the same order they are input, and it will stop to the first provider who doesn't fail.\n\n\n*Doesn't work with async subfeatures.*\n    "
          maxItems: 5
        show_original_response:
          type: boolean
          default: false
          description: "Optional : Shows the original response of the provider.<br>\n        When set to **true**, a new attribute *original_response* will appear in the response object."
        webhook_receiver:
          type: string
          format: uri
          minLength: 1
          description: 'Webhook receiver should be a valid https URL (ex : https://your.listner.com/endpoint).             After the processing is done, the webhook endpoint will receive a POST request with the result.'
        users_webhook_parameters:
          description: 'Json data that contains of additional parameters that will be sent back to the webhook receiver             (ex: api key for security or client''s data ID to link the result internally).             Will only be used when webhook_receiver is set.'
        send_webhook_data:
          type: boolean
          default: true
          description: If set to false the webhook will not contain the result data. Use if your webhook receiver has a request size limit.
        show_base_64:
          type: boolean
          default: true
        file:
          type: string
          format: binary
          description: 'File to analyse in binary format to be used with *content-type*: **multipart/form-data** <br> **Does not work with application/json !**'
        file_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'File **URL** to analyse to be used with with *content-type*: **application/json**.'
        file_password:
          type:
          - string
          - 'null'
          description: If your PDF file has a password, you can pass it here!
          maxLength: 200
        language:
          type:
          - string
          - 'null'
          description: 'Language code of the language the document is written in (ex: fr (French), en (English), es (Spanish))'
      required:
      - providers
    ocrocr_tables_asyncModel:
      properties:
        google:
          $ref: '#/components/schemas/ocrocr_tables_asyncOcrTablesAsyncDataClass'
          default: null
        microsoft:
          $ref: '#/components/schemas/ocrocr_tables_asyncOcrTablesAsyncDataClass'
          default: null
        amazon:
          $ref: '#/components/schemas/ocrocr_tables_asyncOcrTablesAsyncDataClass'
          default: null
      title: ocrocr_tables_asyncModel
      type: object
    Page:
      description: "Page of a document\n\nAttributes:\n    lines (Sequence[Line]): List of lines of the page"
      properties:
        lines:
          description: List of lines
          items:
            $ref: '#/components/schemas/Line'
          title: Lines
          type: array
      title: Page
      type: object
    Line:
      description: "Line of a document\n\nAttributes:\n    text (str): Text detected in the line\n    bounding_boxes (Sequence[BoundingBox]): Bounding boxes of the words in the line\n    words (Sequence[Word]): List of words of the line\n    confidence (float): Confidence of the line"
      properties:
        text:
          description: Text detected in the line
          title: Text
          type: string
        words:
          description: List of words
          items:
            $ref: '#/components/schemas/Word'
          title: Words
          type: array
        bounding_box:
          $ref: '#/components/schemas/BoundingBox'
          default: null
          description: Bounding box of the line, can be None
        confidence:
          description: Confidence of the line
          title: Confidence
          type: integer
      required:
      - text
      - confidence
      title: Line
      type: object
    LaunchAsyncJobResponse:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
      required:
      - public_id
    NotFoundResponse:
      type: object
      properties:
        details:
          type: string
          default: Not Found
    ListAsyncJobResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/AsyncJobList'
      required:
      - jobs
    Word:
      description: "Word of a document\n\nAttributes:\n    text (str): Text detected in the word\n    bounding_boxes (Sequence[BoundingBox]): Bounding boxes of the words in the word\n    confidence (float): Confidence score of the word"
      properties:
        text:
          description: Text detected in the word
          title: Text
          type: string
        bounding_box:
          $ref: '#/components/schemas/BoundingBox'
          description: Bounding boxes of the words in the word
        confidence:
          description: Confidence score of the word
          title: Confidence
          type: integer
      required:
      - text
      - bounding_box
      - confidence
      title: Word
      type: object
    FinalStatusEnum:
      enum:
      - sucess
      - fail
      type: string
    BoundingBox:
      description: "Bounding box of a word in the image\n\nAttributes:\n    left (float): Left coordinate of the bounding box\n    top (float): Top coordinate of the bounding box\n    width (float): Width of the bounding box\n    height (float): Height of the bounding box\n    text (str): Text detected in the bounding box\n\nConstructor:\n    from_json (classmethod): Create a new instance of BoundingBox from a JSON object\n    from_normalized_vertices (classmethod): Create a new instance of BoundingBox from normalized vertices\n    unknown (classmethod): Return a invalid bouding_box with all field filled with `-1`"
      properties:
        left:
          description: Left coordinate of the bounding box
          title: Left
          type: integer
        top:
          description: Top coordinate of the bounding box
          title: Top
          type: integer
        width:
          description: Width of the bounding box
          title: Width
          type: integer
        height:
          description: Height of the bounding box
          title: Height
          type: integer
      required:
      - left
      - top
      - width
      - height
      title: BoundingBox
      type: object
    NestedError:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
      required:
      - message
      - type
  securitySchemes:
    FeatureApiAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
