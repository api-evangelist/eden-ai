components:
  schemas:
    ocrocr_tables_asyncOcrTablesAsyncDataClass:
      properties:
        pages:
          items:
            $ref: '#/components/schemas/Page'
          title: Pages
          type: array
        num_pages:
          title: Num Pages
          type: integer
