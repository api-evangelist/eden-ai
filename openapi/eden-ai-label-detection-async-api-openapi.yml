openapi: 3.2.0
info:
  title: Video Features Label Detection Async API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Label Detection Async
paths:
  /video/label_detection_async/:
    get:
      operationId: video_label_detection_async_retrieve
      description: 'Get a list of all jobs launched for this feature. You''ll then be able to use the ID of each one to get its status and results.


        Please note that a **job status doesn''t get updated until a get request** is sent.'
      summary: Label Detection List Jobs
      tags:
      - Label Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    jobs:
                    - providers: '[''amazon'', ''google'']'
                      nb: 2
                      nb_ok: 2
                      public_id: bb03d369-7e22-418b-af7c-e1a9af7357bb
                      state: finished
                      created_at: '2026-09-06T00:05:17.571472'
                    - providers: '[''amazon'', ''google'']'
                      nb: 2
                      nb_ok: 2
                      public_id: f01c3ce2-9bc1-4a13-bc2d-8a706e8f8805
                      state: finished
                      created_at: '2026-09-05T23:05:17.571485'
                    - providers: '[''amazon'', ''google'']'
                      nb: 2
                      nb_ok: 2
                      public_id: d001fb23-cdd9-48f7-8f98-2877518bd5c7
                      state: finished
                      created_at: '2026-09-05T22:05:17.571491'
                  summary: Response Example
          description: ''
    post:
      operationId: video_label_detection_async_create
      description: 'Available Providers


        |Provider|Version|Price|Billing unit|

        |----|-------|-----|------------|

        |**amazon**|`boto3`|0.1 (per 60 seconde)|60 seconde

        |**google**|`Video intelligence v1`|0.1 (per 60 seconde)|1 seconde'
      summary: Label Detection Launch Job
      tags:
      - Label Detection Async
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,google
                  file: /edenai/edenai/features/video/samples/data/labels.mp4
                summary: Request Example
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,google
                  file_url: http://edenai-resource-example.mp4
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    public_id: f06546bf-05fd-4caf-8246-f21a3d32b92c
                  summary: Response Example
          description: ''
    delete:
      operationId: video_label_detection_async_destroy
      description: 'Generic class to handle method GET all async job for user


        Attributes:

        feature (str): EdenAI feature

        subfeature (str): EdenAI subfeature'
      summary: Label Detection delete Jobs
      tags:
      - Label Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /video/label_detection_async/{public_id}/:
