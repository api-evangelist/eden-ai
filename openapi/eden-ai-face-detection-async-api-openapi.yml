openapi: 3.2.0
info:
  title: Video Features Face Detection Async API
  version: '2.0'
  description: Your project description
servers:
- url: https://api.edenai.run/v2
tags:
- name: Face Detection Async
paths:
  /video/face_detection_async/:
    get:
      operationId: video_face_detection_async_retrieve
      description: 'Get a list of all jobs launched for this feature. You''ll then be able to use the ID of each one to get its status and results.


        Please note that a **job status doesn''t get updated until a get request** is sent.'
      summary: Face Detection List Jobs
      tags:
      - Face Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    jobs:
                    - providers: '[''google'', ''amazon'']'
                      nb: 2
                      nb_ok: 2
                      public_id: 187c32b2-c545-4799-a531-ca563950a4ba
                      state: finished
                      created_at: '2026-09-06T00:05:19.620813'
                    - providers: '[''google'', ''amazon'']'
                      nb: 2
                      nb_ok: 2
                      public_id: ad2fee92-9380-4d17-a66c-5f4b1e5da89b
                      state: finished
                      created_at: '2026-09-05T23:05:19.620827'
                    - providers: '[''google'', ''amazon'']'
                      nb: 2
                      nb_ok: 2
                      public_id: 31370c2c-3543-4622-8593-3e904358c74c
                      state: finished
                      created_at: '2026-09-05T22:05:19.620834'
                  summary: Response Example
          description: ''
    post:
      operationId: video_face_detection_async_create
      description: 'Available Providers


        |Provider|Version|Price|Billing unit|

        |----|-------|-----|------------|

        |**amazon**|`boto3`|0.1 (per 60 seconde)|60 seconde

        |**google**|`Video intelligence v1`|0.1 (per 60 seconde)|1 seconde'
      summary: Face Detection Launch Job
      tags:
      - Face Detection Async
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: google,amazon
                  file: /edenai/edenai/features/video/samples/data/faces.mp4
                summary: Request Example
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncVideoAnalysisRequest'
            examples:
              RequestExample:
                value:
                  providers: google,amazon
                  file_url: http://edenai-resource-example.mp4
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchAsyncJobResponse'
              examples:
                ResponseExample:
                  value:
                    public_id: 9fb49584-1f04-482a-9095-a0777562ac6c
                  summary: Response Example
          description: ''
    delete:
      operationId: video_face_detection_async_destroy
      description: 'Generic class to handle method GET all async job for user


        Attributes:

        feature (str): EdenAI feature

        subfeature (str): EdenAI subfeature'
      summary: Face Detection delete Jobs
      tags:
      - Face Detection Async
      security:
      - FeatureApiAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /video/face_detection_async/{public_id}/:
