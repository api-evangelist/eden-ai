openapi: 3.2.0
info:
  title: Eden Ai Embeddings API
  version: '1.0'
  description: 'Operations tagged Embeddings across 3 of this provider''s published API definitions: eden-ai-image-features-openapi.json, eden-ai-text-features-openapi.json, eden-ai-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.edenai.run/v2
- url: https://api.edenai.run
  description: Production server
tags:
- name: Embeddings
paths:
  /image/embeddings/:
    post:
      operationId: image_embeddings_create
      description: 'Available Providers


        |Provider|Model|Version|Price|Billing unit|

        |----|----|-------|-----|------------|

        |**amazon**|-|`v1`|0.06 (per 1000 file)|1 file

        |**google**|**gemini-embedding-001**|`v1`|0.0 (per 1 token)|1 token


        Supported Languages


        |Name|Value|

        |----|-----|

        |**English**|`en`|

        |**French**|`fr`|

        |**German**|`de`|

        |**Italian**|`it`|

        |**Spanish**|`es`|


        Supported Models'
      summary: Embeddings
      tags:
      - Embeddings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/imageembeddingsEmbeddingsRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,google
                  representation: document
                  file_url: http://edenai-resource-example.jpg
                summary: Request Example
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/imageembeddingsEmbeddingsRequest'
            examples:
              RequestExample:
                value:
                  providers: amazon,google
                  file: /edenai/edenai/features/image/samples/data/logo_detection.jpeg
                  representation: document
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imageembeddingsResponseModel'
              examples:
                ResponseExample:
                  value:
                    amazon:
                      items:
                      - embedding:
                        - 0.0024915815
                        - 0.033428717
                        - 0.008564811
                        - -0.045056097
                        - -0.023462392
                        - 0.010329681
                        - -0.09177325
                        - 0.07059481
                        - -0.03363635
                        - -0.024604367
                      cost: 0.0
                    google:
                      items:
                      - embedding:
                        - -0.00421979045
                        - 0.0456723794
                        - 0.00892922189
                        - 0.0430558734
                        - 0.0188975371
                        - 0.026846787
                        - -0.00719491765
                        - -0.0268030241
                        - -0.00916808844
                        - 0.0063892859
                      cost: 0.0
                  summary: Response Example
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: ''
    servers:
    - url: https://api.edenai.run/v2
  /text/embeddings/:
    post:
      operationId: text_embeddings_create
      description: 'Available Providers


        |Provider|Model|Version|Price|Billing unit|

        |----|----|-------|-----|------------|

        |**openai**|-|`v3.0.0`|0.1 (per 1000000 token)|1 token

        |**openai**|**1536__text-embedding-ada-002**|`v3.0.0`|0.1 (per 1000000 token)|1 token

        |**openai**|**text-embedding-3-large**|`v3.0.0`|0.0 (per 1 token)|1 token

        |**openai**|**text-embedding-3-small**|`v3.0.0`|0.0 (per 1 token)|1 token

        |**openai**|**text-embedding-ada-002**|`v3.0.0`|0.0 (per 1 token)|1 token

        |**openai**|**text-embedding-ada-002-v2**|`v3.0.0`|0.0 (per 1 token)|1 token

        |**google**|**gemini-embedding-001**|`v1`|1.5e-07 (per 1 token)|1 token

        |**cohere**|**embed-english-v3.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-english-light-v3.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-multilingual-v3.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-english-v2.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-english-light-v2.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-multilingual-v2.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-v4.0**|`v1`|0.0 (per 1 token)|1 token

        |**cohere**|**embed-multilingual-light-v3.0**|`v1`|0.0 (per 1 token)|1 token

        |**mistral**|**1024__mistral-embed**|`v0.0.1`|0.1 (per 1000000 token)|1 token

        |**mistral**|-|`v0.0.1`|0.1 (per 1000000 token)|1 token

        |**mistral**|**mistral/mistral-embed**|`v0.0.1`|0.1 (per 1000000 seconde)|1 seconde

        |**mistral**|**mistral-embed**|`v0.0.1`|0.0 (per 1 seconde)|1 seconde

        |**mistral**|**codestral-embed**|`v0.0.1`|0.0 (per 1 seconde)|1 seconde

        |**mistral**|**codestral-embed-2505**|`v0.0.1`|0.0 (per 1 seconde)|1 seconde

        |**jina**|-|`v1`|0.018 (per 1000000 token)|1 token

        |**jina**|**jina-embeddings-v2-base-en**|`v1`|0.018 (per 1000000 token)|1 token

        |**jina**|**jina-embeddings-v3**|`v1`|0.02 (per 1000000 token)|1 token


        Supported Models


        Default Models


        |Name|Value|

        |----|-----|

        |**openai**|`1536__text-embedding-ada-002`|

        |**google**|`text-multilingual-embedding-002`|

        |**cohere**|`4096__embed-english-v2.0`|

        |**mistral**|`1024__mistral-embed`|

        |**jina**|`jina-embeddings-v3`|'
      summary: Embeddings
      tags:
      - Embeddings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/textembeddingsEmbeddingsRequest'
            examples:
              RequestExample:
                value:
                  providers: cohere,mistral,jina,openai,google
                  texts:
                  - Hello world
                summary: Request Example
        required: true
      security:
      - FeatureApiAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/textembeddingsResponseModel'
              examples:
