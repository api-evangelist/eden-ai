    servers:
    - url: https://api.edenai.run/v2
  /ocr/ocr:
    post:
      summary: OCR
      description: Extract text from an image or PDF using selected OCR providers.
      operationId: ocr
      tags:
      - OCR
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - providers
              - file
              properties:
                providers:
                  type: string
                file:
                  type: string
                  format: binary
                language:
                  type: string
      responses:
        '200':
          description: OCR results
      security:
      - bearerAuth: []
    servers:
    - url: https://api.edenai.run/v2
      description: Production
components:
  schemas:
    BadRequest:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/NestedBadRequest'
      required:
      - error
    ocrocrResponseModel:
      properties:
        api4ai:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        clarifai:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        amazon:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        microsoft:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        mistral:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        google:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        sentisight:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
        base64:
          $ref: '#/components/schemas/ocrocrOcrDataClass'
          default: null
      title: ocrocrResponseModel
      type: object
    NotFoundResponse:
      type: object
      properties:
        details:
          type: string
          default: Not Found
    FieldError:
      type: object
      properties:
        <parameter_name>:
          type: array
          items:
            type: string
      required:
      - <parameter_name>
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/NestedError'
      required:
      - error
    ocrocrOcrDataClass:
      properties:
        text:
          title: Text
          type: string
        bounding_boxes:
          items:
            $ref: '#/components/schemas/Bounding_box'
          title: Bounding Boxes
          type: array
        original_response:
          default: null
          description: original response sent by the provider, hidden by default, show it by passing the `show_original_response` field to `true` in your request
          title: Original Response
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Status
      required:
      - text
      - status
      title: ocrocrOcrDataClass
      type: object
    NestedError:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
      required:
      - message
      - type
    StatusEnum:
      enum:
      - sucess
      - fail
      type: string
    Bounding_box:
      properties:
        text:
          title: Text
          type: string
        left:
          title: Left
          type: integer
        top:
          title: Top
          type: integer
        width:
          title: Width
          type: integer
        height:
          title: Height
          type: integer
      required:
      - text
      - left
      - top
      - width
      - height
      title: Bounding_box
      type: object
    ocrocrOcrRequest:
      type: object
      properties:
        settings:
          type: string
          default: {}
          description: "A dictionnary or a json object to specify specific models to use for some providers. <br>                     It can be in the following format: {\"google\" : \"google_model\", \"ibm\": \"ibm_model\"...}.\n                     "
        providers:
          type: array
          items:
            type: string
            minLength: 1
