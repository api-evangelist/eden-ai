description: >-
  Eden AI's own integration strategy is to be OpenAI-wire-compatible rather than to ship a client
  library: the docs tell you to point the official OpenAI Python or TypeScript SDK at
  https://api.edenai.run/v3. Its own first-party publishing is therefore thin — an alpha Python SDK
  that has not shipped since February 2025, an n8n community node, and an OpenClaw provider plugin.
  The one npm package that carried the bare `edenai` name was UNPUBLISHED on 2026-04-08.
