description: Versioning, deprecation, status and support commitments as Eden AI publishes them.
versioning:
  style: uri-path
  current_version: v3
  base_urls:
    - https://api.edenai.run
    - https://api.eu.edenai.run
  previous_version: v2
  note: >-
    v3 is the current AI surface. v2 survives for cost monitoring and API-token management and is
    still the only place several feature contracts are published — the twelve harvested specs
    include eight v2 feature slices with no v3 per-feature equivalent (the v3 replacement is one
    model-routed /v3/universal-ai operation).
deprecation:
  policy_page: null
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  statements:
    - scope: v2 API
      statement: >-
        "v2 is legacy. Only cost monitoring and user-token management remain on /v2/* — supported
        through end of 2026. Never use v2 for AI calls."
      source: skills/eden-ai-edenai.md
      upstream: https://github.com/edenai/edenai-skill
      note: >-
        This is the only end-of-life date Eden AI publishes anywhere, and it appears in the Agent
        Skill repository rather than in the documentation site. It is a real first-party statement
        with a real date, so it is recorded — but there is no deprecation-policy page, no
        Sunset/Deprecation response header, and no `deprecated: true` flag on any operation in any
        of the twelve first-party specs.
    - scope: legacy account tokens
      statement: >-
        A legacy primary/sandbox key (a JWT in a User column) is regenerated as a real hashed
        sk-eden custom key via POST /v2/user/custom_token/legacy/{legacy_type}/regenerate/.
      source: openapi/_original/eden-ai-user-management-openapi.json
  gap: >-
    No machine-readable deprecation signal exists. An agent calling a v2 feature endpoint on
    2027-01-01 gets no advance warning from the API itself.
